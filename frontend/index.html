<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Big+Shoulders+Display:wght@500..900&family=Inter:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>IRONCORE - Gym ERP</title>
    <!--
      Runs before the first paint, on purpose.

      The stylesheet keys off `data-theme`, and React sets it after the bundle
      parses -- so without this a light-mode user gets a full dark page first,
      then a flash to light. Inline and synchronous is the only way to beat
      that, which is why this duplicates a few lines of themeStore.ts rather
      than importing them.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ironcore.theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
